<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070f"/>
      <stop offset="0.6" stop-color="#12082a"/>
      <stop offset="1" stop-color="#1a0630"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#ff2a6d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f0ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity="0.25"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1000" height="300"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>

    <!-- perspective sun / horizon -->
    <circle cx="840" cy="210" r="90" fill="#ff2a6d" fill-opacity="0.18"/>
    <circle cx="840" cy="210" r="60" fill="#f9f002" fill-opacity="0.12"/>
    <path d="M0 230H1000" stroke="#ff2a6d" stroke-opacity="0.6" stroke-width="1.5"/>
    <g stroke="#ff2a6d" stroke-opacity="0.25">
      <path d="M500 230L-200 300M500 230L0 300M500 230L200 300M500 230L400 300M500 230L500 300M500 230L600 300M500 230L800 300M500 230L1000 300M500 230L1200 300"/>
      <path d="M0 245H1000M0 262H1000M0 282H1000"/>
    </g>

    <!-- skyline -->
    <g fill="#0b0b1c" stroke="#00f0ff" stroke-opacity="0.35">
      <rect x="640" y="150" width="30" height="80"/>
      <rect x="675" y="120" width="40" height="110"/>
      <rect x="720" y="165" width="26" height="65"/>
      <rect x="760" y="100" width="46" height="130"/>
      <rect x="812" y="140" width="34" height="90"/>
      <rect x="852" y="170" width="28" height="60"/>
      <rect x="888" y="115" width="44" height="115"/>
      <rect x="940" y="155" width="40" height="75"/>
    </g>
    <g fill="#f9f002">
      <rect x="682" y="132" width="4" height="4"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></rect>
      <rect x="770" y="115" width="4" height="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></rect>
      <rect x="898" y="130" width="4" height="4"><animate attributeName="opacity" values="1;0.1;1" dur="4s" repeatCount="indefinite"/></rect>
      <rect x="820" y="155" width="4" height="4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></rect>
    </g>

    <!-- title -->
    <text x="50" y="78" font-family="'Courier New', monospace" font-size="16" fill="#00f0ff" letter-spacing="4" filter="url(#glow)">&gt; SYSTEM.BOOT // USER_AUTHENTICATED</text>

    <g font-family="'Courier New', monospace" font-weight="bold" font-size="64" letter-spacing="2">
      <text x="47" y="150" fill="#ff2a6d" opacity="0.8">
        RAY VAZQUEZ
        <animate attributeName="x" values="47;51;47;46;47" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="53" y="146" fill="#00f0ff" opacity="0.8">
        RAY VAZQUEZ
        <animate attributeName="x" values="53;49;53;54;53" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="50" y="148" fill="#ffffff" filter="url(#glow)">RAY VAZQUEZ</text>
    </g>

    <rect x="50" y="170" width="440" height="3" fill="url(#neon)" filter="url(#glow)"/>

    <text x="50" y="205" font-family="'Courier New', monospace" font-size="19" fill="#f9f002" letter-spacing="1">DATA &amp; ML SCIENTIST  //  ENGINEER  //  BUILDER</text>
    <text x="50" y="235" font-family="'Courier New', monospace" font-size="14" fill="#9aa0c8" letter-spacing="1">Azure Networking · Python · Machine Learning · Texas<tspan fill="#00f0ff"> █</tspan>
      <animate attributeName="opacity" values="1;1;1;0.85;1" dur="5s" repeatCount="indefinite"/>
    </text>

    <!-- scanlines + sweeping beam -->
    <rect width="1000" height="300" fill="url(#scan)"/>
    <rect y="-40" width="1000" height="40" fill="#00f0ff" fill-opacity="0.06">
      <animate attributeName="y" values="-40;300" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- frame -->
  <rect x="1.5" y="1.5" width="997" height="297" fill="none" stroke="url(#neon)" stroke-width="3"/>
  <path d="M0 40V0H40M960 0H1000V40M1000 260V300H960M40 300H0V260" fill="none" stroke="#f9f002" stroke-width="4"/>
</svg>
