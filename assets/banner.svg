<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a11"/>
      <stop offset="1" stop-color="#0b1826"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ad7ff"/>
      <stop offset="1" stop-color="#5ad7ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5ad7ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5ad7ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#5ad7ff" fill-opacity="0.16"/>
    </pattern>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1000" height="300"/></clipPath>
  </defs>

  <g clip-path="url(#clip)" font-family="Bahnschrift, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#dots)"/>
    <circle cx="790" cy="150" r="220" fill="url(#glowR)"/>

    <!-- top status strip -->
    <g font-size="11" letter-spacing="3" fill="#6f93a8">
