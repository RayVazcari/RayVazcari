<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a11"/>
      <stop offset="1" stop-color="#0b1826"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ad7ff"/>
      <stop offset="1" stop-color="#5ad7ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5ad7ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5ad7ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#5ad7ff" fill-opacity="0.16"/>
    </pattern>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1000" height="300"/></clipPath>
  </defs>

  <g clip-path="url(#clip)" font-family="Bahnschrift, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#dots)"/>
    <circle cx="790" cy="150" r="220" fill="url(#glowR)"/>

    <!-- top status strip -->
    <g font-size="11" letter-spacing="3" fill="#6f93a8">
      <text x="48" y="40">RV-01 // OPERATOR PROFILE</text>
      <text x="952" y="40" text-anchor="end">SECTOR: TEXAS  ·  NET: AZURE</text>
    </g>
    <path d="M48 52H952" stroke="#5ad7ff" stroke-opacity="0.35"/>
    <path d="M48 52H220" stroke="#5ad7ff" stroke-width="2"/>

    <!-- status -->
    <circle cx="52" cy="86" r="4" fill="#ffb347">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="66" y="90" font-size="12" letter-spacing="4" fill="#ffb347">STATUS: ONLINE</text>

    <!-- name -->
    <text x="48" y="168" font-size="68" font-weight="700" letter-spacing="7" fill="#e8f6ff" filter="url(#soft)">RAY VAZQUEZ</text>
    <path d="M48 188H420" stroke="url(#line)" stroke-width="3"/>
    <path d="M48 196H200" stroke="#5ad7ff" stroke-opacity="0.45"/>

    <text x="48" y="228" font-size="19" letter-spacing="5" fill="#5ad7ff">DATA &amp; ML SCIENTIST</text>
    <text x="48" y="254" font-size="13" letter-spacing="3" fill="#7fa0b4">MECHANICAL ENGINEER  ·  AZURE NETWORKING  ·  BUILDER</text>

    <!-- radar -->
    <g transform="translate(772 174) scale(0.86)">
      <circle r="112" fill="none" stroke="#5ad7ff" stroke-opacity="0.18"/>
      <circle r="84" fill="none" stroke="#5ad7ff" stroke-opacity="0.28"/>
      <circle r="56" fill="none" stroke="#5ad7ff" stroke-opacity="0.38"/>
      <circle r="28" fill="none" stroke="#5ad7ff" stroke-opacity="0.5"/>
      <path d="M-124 0H124M0 -124V124" stroke="#5ad7ff" stroke-opacity="0.22"/>
      <circle r="118" fill="none" stroke="#5ad7ff" stroke-opacity="0.7" stroke-width="3" stroke-dasharray="2 8.2"/>
      <circle r="124" fill="none" stroke="#5ad7ff" stroke-opacity="0.9" stroke-width="2" stroke-dasharray="60 25 8 25">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      </circle>
      <g>
        <path d="M0 0L112 0A112 112 0 0 0 98 -54Z" fill="#5ad7ff" fill-opacity="0.22"/>
        <path d="M0 0H112" stroke="#5ad7ff" stroke-width="2"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
      </g>
      <circle cx="46" cy="-38" r="3.5" fill="#ffb347"><animate attributeName="opacity" values="1;0.1;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="-58" cy="30" r="3" fill="#e8f6ff"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="20" cy="70" r="2.5" fill="#5ad7ff"><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle r="3" fill="#e8f6ff"/>
    </g>

    <!-- side data bars -->
    <g font-size="10" letter-spacing="2" fill="#6f93a8">
      <text x="912" y="248" text-anchor="end">ML</text>
      <rect x="918" y="241" width="34" height="3" fill="#5ad7ff" fill-opacity="0.2"/><rect x="918" y="241" width="26" height="3" fill="#5ad7ff"/>
      <text x="912" y="262" text-anchor="end">PY</text>
      <rect x="918" y="255" width="34" height="3" fill="#5ad7ff" fill-opacity="0.2"/><rect x="918" y="255" width="31" height="3" fill="#5ad7ff"/>
      <text x="912" y="276" text-anchor="end">AZ</text>
      <rect x="918" y="269" width="34" height="3" fill="#5ad7ff" fill-opacity="0.2"/><rect x="918" y="269" width="29" height="3" fill="#5ad7ff"/>
    </g>

    <!-- bottom tick scale -->
    <path d="M48 284H560" stroke="#5ad7ff" stroke-opacity="0.35"/>
    <path d="M48 284v-6M98 284v-6M148 284v-6M198 284v-6M248 284v-6M298 284v-6M348 284v-6M398 284v-6M448 284v-6M498 284v-6M548 284v-6" stroke="#5ad7ff" stroke-opacity="0.55"/>

    <!-- slow scan beam -->
    <rect x="-60" y="0" width="60" height="300" fill="#5ad7ff" fill-opacity="0.04">
      <animate attributeName="x" values="-60;1000" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- frame + corner brackets -->
  <rect x="0.5" y="0.5" width="999" height="299" fill="none" stroke="#5ad7ff" stroke-opacity="0.28"/>
  <path d="M0 30V0H30M970 0H1000V30M1000 270V300H970M30 300H0V270" fill="none" stroke="#5ad7ff" stroke-width="3"/>
</svg>
